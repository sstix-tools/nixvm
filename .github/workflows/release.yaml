name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install manifest tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Create source archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkg_name="nixvm"
          source_root="build/source/$pkg_name-$VERSION"
          mkdir -p build/source

          install -D -m 0755 "bin/$pkg_name" "$source_root/bin/$pkg_name"
          install -D -m 0644 "completion/_$pkg_name" "$source_root/completion/_$pkg_name"
          install -D -m 0644 flake.nix "$source_root/flake.nix"
          install -D -m 0644 flake.lock "$source_root/flake.lock"
          install -D -m 0644 README.md "$source_root/README.md"
          install -D -m 0644 LICENSE "$source_root/LICENSE"

          tar \
            --directory build/source \
            --create \
            --gzip \
            --file "build/$pkg_name-$VERSION.tar.gz" \
            "$pkg_name-$VERSION"

      - name: Calculate source hash
        id: source_hash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkg_name="nixvm"
          archive="build/$pkg_name-$VERSION.tar.gz"

          digest="$(
            sha256sum "$archive" |
            awk '{print $1}' |
            xxd -r -p |
            base64 -w 0
          )"

          printf 'sha256-%s\n' "$digest" \
            > "build/$pkg_name-$VERSION.tar.gz.sri"

          echo "Generated Nix hash:"
          cat "build/$pkg_name-$VERSION.tar.gz.sri"

      - name: Create release manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkg_name="nixvm"
          source_asset="$pkg_name-$VERSION.tar.gz"
          source_hash="$(cat "build/$source_asset.sri")"

          jq -n \
            --arg name "$pkg_name" \
            --arg version "$VERSION" \
            --arg source "$source_asset" \
            --arg source_hash "$source_hash" \
            '{
              name: $name,
              version: $version,
              type: "bash-utility",
              description: "Nix-backed Java, Ruby, and Python version manager for macOS",
              source_archive: $source,
              source_hash: $source_hash,
              apt_packages: [],
              rpm_packages: [],
              dependencies: ["nix", "coreutils", "jq"],
              executables: [$name],
              completions: [("_" + $name)],
              nix_systems: [
                "aarch64-darwin"
              ]
            }' \
            > build/manifest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mapfile -d '' assets < <(
            find build \
              -maxdepth 1 \
              -type f \
              -print0
          )

          printf 'Release assets:\n'
          printf ' - %s\n' "${assets[@]}"

          gh release create "$GITHUB_REF_NAME" \
            --title "nixvm $VERSION" \
            --generate-notes \
            "${assets[@]}"

      - name: Trigger registry update
        if: always()
        env:
          DISPATCH_TOKEN: ${{ secrets.REGISTRY_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "Notifying registry of new release..."
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            https://api.github.com/repos/sstix-tools/registry/dispatches \
            -d '{"event_type": "tool_release", "client_payload": {"repository": "${{ github.repository }}", "tag": "${{ github.ref_name }}"}}' \
            || true
